
name: zar3a
description: "Smart Agriculture Mobile Application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7

  cupertino_icons: ^1.0.2
  flutter_bloc: ^9.1.1
  bloc: ^9.1.1
  intl: ^0.20.2
  image_picker: ^1.2.4
  camera: ^0.12.2
  permission_handler: ^10.1.0
  shared_preferences: ^2.5.3
  go_router: ^18.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-ExtraLight.ttf
          weight: 200

        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 300

        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400

        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500

        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700

        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800

        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900